<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>尼龙虾 NEEKO 智能交易 - 客户登录</title>
    <script src="origin.js"></script>
    <script src="vendor/tailwindcss.js"></script>
    <style>
      .login-shell {
        background:
          radial-gradient(ellipse at 20% 0%, rgba(251, 191, 36, 0.18), transparent 45%),
          radial-gradient(ellipse at 80% 100%, rgba(34, 211, 238, 0.12), transparent 40%),
          #020617;
      }
      .brand-panel {
        box-shadow:
          0 0 0 1px rgba(251, 191, 36, 0.25),
          0 24px 80px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body class="login-shell min-h-screen text-slate-100">
    <div class="flex min-h-screen items-center justify-center px-4">
      <form
        id="login-form"
        class="brand-panel w-full max-w-md space-y-5 rounded-2xl border border-amber-500/20 bg-slate-950/80 p-8 backdrop-blur-md"
      >
        <div class="text-center">
          <p class="text-[11px] font-medium uppercase tracking-[0.42em] text-cyan-300/90">
            NEEKO Smart Trading Dashboard
          </p>
          <h1
            class="mt-3 bg-gradient-to-r from-amber-200 via-white to-cyan-200 bg-clip-text text-2xl font-semibold tracking-wide text-transparent"
          >
            尼龙虾 NEEKO 智能交易系统
          </h1>
          <p class="mt-2 text-sm text-slate-400">点击进入即可打开 12 屏实时监控大屏</p>
        </div>
        <label class="block text-sm">
          <span class="mb-1.5 block text-slate-300">客户 ID</span>
          <input
            name="id"
            autocomplete="username"
            placeholder="任意账号即可"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-amber-500"
          />
        </label>
        <label class="block text-sm">
          <span class="mb-1.5 block text-slate-300">密码</span>
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="任意密码即可"
            class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-amber-500"
          />
        </label>
        <button
          type="submit"
          class="w-full rounded-lg bg-amber-500 py-2.5 font-medium text-slate-950 hover:bg-amber-400"
        >
          进入大屏
        </button>
        <p id="status" class="min-h-5 text-sm text-rose-400"></p>
      </form>
    </div>
    <script>
      function nicoTag(n) {
        return "nico" + String(n).padStart(2, "0");
      }

      function validPair(user, pass) {
        const u = String(user || "").trim().toLowerCase();
        const p = String(pass || "").trim().toLowerCase();
        const match = /^nico(0[1-9]|[1-4][0-9]|50)$/.exec(u);
        if (!match) return false;
        const n = Number(match[1]);
        return p === nicoTag(51 - n);
      }

      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const id = form.elements.namedItem("id")?.value || "";
        const password = form.elements.namedItem("password")?.value || "";
        if (!validPair(id, password)) {
          alert("Invalid Client ID or Password");
          return;
        }
        localStorage.setItem("auth_token", "logged_in");
        try {
          await fetch(window.NEEKO_ORIGIN ? NEEKO_ORIGIN.apiUrl("/api/auth/login") : "api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, username: id, password }),
          });
        } catch (_err) {}
        window.location.href = window.NEEKO_ORIGIN ? NEEKO_ORIGIN.pageUrl("index.html") : "index.html";
      });
    </script>
  </body>
</html>
