<!DOCTYPE html>

  <head>

    <style>
      html, body {
        height: 100%;
        background:
          radial-gradient(ellipse at 0% 0%, rgba(34, 211, 238, 0.08), transparent 42%),
          radial-gradient(ellipse at 100% 100%, rgba(245, 185, 66, 0.08), transparent 40%),

      .wall {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: 8px;
        height: calc(100vh - 56px);
      }
      .phone {
        display: flex; flex-direction: column; min-height: 0;
        border: 6px solid #07070a; border-radius: 26px; background: #05060a;
        box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.25);

      .screen {
        display: flex; flex-direction: column; flex: 1; min-height: 0;
        margin: 4px; border-radius: 16px; overflow: hidden; background: #060b14;
      }
      .bot-head {
        flex: none; padding: 4px 7px 5px;
        background: linear-gradient(90deg, #0b1220, #111827);
        border-bottom: 1px solid rgba(34, 211, 238, 0.2);

      .strat-tag {
        display: inline-block; margin-top: 2px;
        padding: 1px 5px; border-radius: 3px;
        border: 1px solid rgba(245, 185, 66, 0.35);

        color: #fbbf24; font-size: 9px; line-height: 1.35; letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .chart-box {
        position: relative; flex: 1 1 56%; min-height: 0; overflow: hidden;
        background: #070b12; pointer-events: none !important;
      }
      .chart-host { position: absolute; inset: 0; overflow: hidden; }
      .chart-host canvas { display: block; }
      .chart-host canvas { display: block; }
      .chart-host .tv-lightweight-charts {
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        width: 100% !important;

      }
      .chart-host .tv-lightweight-charts table {
        display: table !important;

      .chart-host .tv-lightweight-charts tr { display: table-row !important; }
      .chart-host .tv-lightweight-charts td {

        display: block !important;

      .bot-panel [data-pnl],

        margin-top: 3px; font-size: 9px !important; font-weight: 600 !important;

    <script>
      if (localStorage.getItem("auth_token") !== "logged_in") {
        window.location.replace("/login.html");
        throw new Error("unauthorized");
      }
      const PAGE_SIZE = 60;
      const GROUP_COUNT = 20;
      const BOT_COUNT = 1200;
      const GROUP_LETTERS = "ABCDEFGHIJKLMNOPQRST";
      const MAJOR_ASSETS = ["BTC", "ETH", "SOL", "XRP", "DOGE", "ADA", "BNB"];
      const INTERVALS = ["1m", "3m"];
      const INTERVAL_SEC = { "1m": 60, "3m": 180 };
      const LEDGER_KEY = "NEEKO_LEDGER_v4";
      const SMALL_IDS = new Set([5, 14, 25, 37, 49, 55]);
      const STRATEGY_TAGS = [
        "TTM Trend", "DQCNN Risk", "Liq Absorption", "ATR Volatility", "Rekblock Pivot", "Dynamic HFT",
        "Fractal Breakout", "Low Risk Algo", "TTM Model", "HFT Liquidity", "Deep Accumulation", "Trend Following",
        "EMA Cross", "VWAP Reversion", "Orderflow Sweep", "Gamma Scalp", "Basis Arb", "Funding Harvest",
        "Momentum Pulse", "Mean Revert", "Breakout Fade", "Range Bound", "Vol Harvest", "Delta Neutral",
        "Tape Reading", "Iceberg Hunt", "Spoof Filter", "Microstructure", "Session Drift", "Open Drive",
        "Close Auction", "News Impulse", "Carry Overlay", "Grid Passive", "Maker Edge", "Taker Sweep",
        "Stat Arb", "Pair Hedge", "Beta Neutral", "Trend Resume", "Pullback Buy", "Rally Fade",
        "Squeeze Play", "Expansion Ride", "Compression Coil", "Liquidity Vacuum", "Stop Run", "Wick Rejection",
        "Higher Highs", "Lower Lows", "Structure Hold", "Invalidation", "Risk Parity", "Kelly Fraction",
        "Vol Target", "Drawdown Guard", "Circuit Breaker", "Inventory Skew", "Quote Tighten", "Quote Widen",
      ];
      const SIZE_DECIMALS = { BTC: 4, ETH: 4, BNB: 3, SOL: 3, XRP: 2, DOGE: 2, ADA: 2 };
      const FIXED_MARKS = {
        BTCUSDT: 77153.29,
        ETHUSDT: 2397.73,
        BNBUSDT: 691.53,
        SOLUSDT: 100.26,
        XRPUSDT: 1.3581,
        DOGEUSDT: 0.08239,
        ADAUSDT: 0.20531,
      };

      function fnv1a(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i += 1) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function unixSec() {
        return Math.floor(Date.now() / 1000);
      }

      function dayStartSec(t = unixSec()) {
        return t - (t % 86400);
      }

      function utcYmdSec(t = unixSec()) {
        const d = new Date(t * 1000);
        return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
      }

      function mulberry32(seed) {
        let a = seed >>> 0;
        return function mulberry32next() {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function seedFrom(sec, botId, symbol, salt) {
        return fnv1a(`${sec}|${botId || 0}|${String(symbol || "").toUpperCase()}|${salt || ""}`);
      }

      function tickRng(sec, botId, symbol, salt) {
        return mulberry32(seedFrom(sec, botId, symbol, salt));
      }

      function seededUnit(sec, botId, symbol, salt) {
        return tickRng(sec, botId, symbol, salt)();
      }

      function chartTf(interval) {
        return interval === "3m" ? "3m" : "1m";
      }

      function liveMarkOf(symbol) {
        const px = liveMarkBySymbol.get(String(symbol || "").toUpperCase());
        return Number(px) > 0 ? px : 0;
      }

      function clockExposure(st, t = unixSec()) {
        const u = seededUnit(Math.floor(t / 20), st.id, st.symbol, "exp");
        return clampExposure(0.065 + u * 0.02);
      }

      function clockBalance(st, t = unixSec()) {
        const start = dayStartSec(t);
        const fracDay = Math.max(0, Math.min(1, (t - start) / 86400));
        const rate = dailyRate(st, utcYmdSec(t));
        const u = seededUnit(Math.floor(t / 20), st.id, st.symbol, "bal");
        const expected = st.initialBalance * (1 + rate * fracDay * 1.01);
        const span = st.initialBalance * rate * fracDay * 0.55;
        const min = isSmallBot(st.id) ? 18427.35 : 50000;
        return roundMoney(Math.max(min, expected + (u - 0.5) * 2 * span));
      }

      function canonicalEntry(st) {
        const ref = liveMarkOf(st.symbol) || fallbackMark(st.symbol);
        return roundPx(entryFromMark(ref, st.leverage, st.side, st.roiBias), st.symbol);
      }

      function roundMoney(n) {
        return Math.round(Number(n) * 100) / 100;
      }

      function irregularMoney(lo, hi, botId, salt) {
        const u = fnv1a(`NEEKO-bal|${botId}|${salt}`) / 4294967295;
        const cents = 11 + (fnv1a(`NEEKO-cents|${botId}|${salt}`) % 89);
        let x = lo + u * (hi - lo);
        x = Math.floor(x) + cents / 100;
        if (Math.abs(x - Math.round(x)) < 1e-9) x += 0.37;
        if (Math.round(x) % 100 === 0 || Math.round(x) % 1000 === 0) x += (botId % 7) * 0.13 + 0.29;
        x = roundMoney(Math.min(hi, Math.max(lo, x)));
        if (x === Math.round(x)) x = roundMoney(x + 0.41);
        return x;
      }

      function isSmallBot(id) {
        return SMALL_IDS.has(((Number(id) - 1) % PAGE_SIZE) + 1);
      }

      function buildAccountBook() {
        const book = {};
        const largeIds = [];
        let smallSum = 0;
        for (let id = 1; id <= BOT_COUNT; id += 1) {
          const asset = MAJOR_ASSETS[(id - 1) % MAJOR_ASSETS.length];
          const small = isSmallBot(id);
          const u = fnv1a(`NEEKO-exp|${id}`) / 4294967295;
          const initialBalance = small
            ? irregularMoney(18427.35, 93612.8, id, "small")
            : irregularMoney(312480.19, 2450180.47, id, "large");
          if (small) smallSum += initialBalance;
          else largeIds.push(id);
          book[id] = {
            symbol: `${asset}USDT`,
            interval: INTERVALS[(id - 1) % INTERVALS.length],
            strategy: STRATEGY_TAGS[(id - 1) % STRATEGY_TAGS.length],
            initialBalance,
            exposure: 0.065 + u * 0.02,
            side: fnv1a(`NEEKO-side|${id}`) % 2 === 0 ? "LONG" : "SHORT",
            leverage: 5 + (fnv1a(`NEEKO-lev|${id}`) % 5),
          };
        }
        const target = roundMoney(260000000 + (fnv1a("NEEKO-aum-1200") / 4294967295) * 34999999.17);
        const cap = Math.min(295000000, Math.max(260000000, target));
        let largeSum = 0;
        for (const id of largeIds) largeSum += book[id].initialBalance;
        const remain = Math.max(1000, cap - smallSum);
        const factor = largeSum > 0 ? remain / largeSum : 1;
        let used = smallSum;
        for (let i = 0; i < largeIds.length; i += 1) {
          const id = largeIds[i];
          let next = roundMoney(book[id].initialBalance * factor);
          if (next === Math.round(next)) next = roundMoney(next + ((id % 17) + 13) / 100);
          if (i === largeIds.length - 1) next = roundMoney(Math.max(18427.35, cap - used));
          if (next === Math.round(next)) next = roundMoney(next - 0.17);
          book[id].initialBalance = next;
          used = roundMoney(used + next);
        }
        return book;
      }

      const ACCOUNT_BOOK = buildAccountBook();
      let groupIndex = 0;
      const wall = document.getElementById("wall");
      wall.style.gridTemplateRows = `repeat(${Math.ceil(PAGE_SIZE / 6)}, minmax(340px, 1fr))`;
      wall.style.height = "auto";
      wall.style.minHeight = "calc(100vh - 90px)";
      document.documentElement.style.overflowY = "auto";
      document.body.style.overflowY = "auto";

      function botIdOfSlot(slot) {
        return groupIndex * PAGE_SIZE + slot;
      }
      function slotOfBot(botId) {
        const start = groupIndex * PAGE_SIZE + 1;
        if (botId < start || botId > start + PAGE_SIZE - 1) return 0;
        return botId - start + 1;
      }

      const phones = new Map();
      const botState = new Map();
      const charts = new Map();
      const chartMountSeq = new Map();
      const klineCache = new Map();
      const klineInflight = new Map();
      const liveMarkBySymbol = new Map();
      let slotsCache = [];
      let marketWs;
      let marketReconnectTimer = 0;
      let marketWsGeneration = 0;
      let marketFeedKind = "futures";
      let liveTickRaf = 0;
      const liveTickBuf = new Map();
      let logsStarted = false;
      let tradeStarted = false;
      let markPulseStarted = false;
      let lastWsAt = 0;
      let ledgerCache = { bots: {} };
      let chartMountCursor = 0;
      let dirtyCanvas = new Set();
      let canvasRaf = 0;
      let reloadStarted = false;
      const reloadingIds = new Set();

      function injectReloadStyles() {
        if (document.getElementById("neeko-reload-style")) return;
        const sheet = document.createElement("style");
        sheet.id = "neeko-reload-style";
        sheet.textContent = `
          @keyframes neekoSpin { to { transform: rotate(360deg); } }
          @keyframes neekoPulseTxt { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
        `;
        document.head.appendChild(sheet);
      }

      function attachReloadMask(el) {
        if (el.querySelector("[data-reload-mask]")) return;
        el.style.position = "relative";
        const mask = document.createElement("div");
        mask.setAttribute("data-reload-mask", "");
        mask.style.cssText = [
          "position:absolute",
          "inset:0",
          "z-index:30",
          "display:flex",
          "flex-direction:column",
          "align-items:center",
          "justify-content:center",
          "gap:10px",
          "background:rgba(2,6,14,0.82)",
          "backdrop-filter:blur(2px)",
          "pointer-events:none",
          "opacity:0",
          "visibility:hidden",
          "transition:opacity 0.35s ease, visibility 0.35s ease",
        ].join(";");
        const spin = document.createElement("div");
        spin.style.cssText = [
          "width:18px",
          "height:18px",
          "border:2px solid rgba(34,211,238,0.18)",
          "border-top-color:#22d3ee",
          "border-radius:50%",
          "animation:neekoSpin 0.7s linear infinite",
        ].join(";");
        const label = document.createElement("div");
        label.setAttribute("data-reload-text", "");
        label.style.cssText = [
          "font-size:10px",
          "letter-spacing:0.16em",
          "color:#67e8f9",
          "font-variant:small-caps",
          "animation:neekoPulseTxt 1.4s ease-in-out infinite",
        ].join(";");
        label.textContent = "[SYSTEM RELOADING]";
        mask.appendChild(spin);
        mask.appendChild(label);
        el.appendChild(mask);
      }

      function ymd(now = new Date()) {
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
      }

      function dayUnit(botId, salt = "") {
        return fnv1a(`NEEKO-day|${ymd()}|bot-${botId}|${salt}`) / 4294967295;
      }

      function dateSeedRoi(botId, now = new Date()) {
        const dayIndex = Math.floor(now.getTime() / 86400000);
        const unique = fnv1a(`NEEKO|${dayIndex}|bot-${botId}`);
        const unit = unique / 4294967295;
        const wave = Math.sin(dayIndex * (0.097 + botId * 0.013) + botId * 1.7) * (3.8 + (botId % 12) * 0.21);
        const trend = (((dayIndex + botId * 17) % 367) / 367) * 6.4 - 1.8;
        const roi = (unit - 0.28) * 21.6 + wave + trend * 0.35;
        return Math.round(roi * 100) / 100;
      }

      function dayBook(botId, book) {
        const t = dayUnit(botId, "run");
        const minutes = 190 + Math.floor(t * 1180);
        const hh = String(Math.floor(minutes / 60)).padStart(2, "0");
        const mm = String(minutes % 60).padStart(2, "0");
        return {
          initialBalance: Number(book.initialBalance),
          exposure: clampExposure(book.exposure),
          runtimeLabel: `Live session ${hh}h ${mm}m`,
          roiBias: dateSeedRoi(botId),
        };
      }

      function safeSlot(slot) {
        const id = Number(slot?.id) || 0;
        const book = ACCOUNT_BOOK[id] || ACCOUNT_BOOK[1];
        const day = dayBook(id, book);
        const leverage = Number(book.leverage);
        const side = String(book.side || "LONG").toUpperCase() === "SHORT" ? "SHORT" : "LONG";
        const interval = INTERVALS.includes(book.interval) ? book.interval : "1m";
        return {
          id,
          name: `NEEKO Bot #${String(id).padStart(4, "0")}`,
          symbol: String(book.symbol).toUpperCase(),
          interval,
          strategy: book.strategy,
          leverage: Number.isFinite(leverage) && leverage > 0 ? leverage : 8,
          initialBalance: day.initialBalance,
          side,
          exposure: day.exposure,
          roiBias: day.roiBias,
          runtimeLabel: day.runtimeLabel,
          dayKey: ymd(),
        };
      }

      function entryFromMark(mark, leverage, side, roiPct) {
        const r = roiPct / 100 / leverage;
        if (side === "LONG") return mark / (1 + r);
        return mark * (1 + r);
      }

      function liqFromEntry(entry, side) {
        return side === "LONG" ? entry * 0.85 : entry * 1.15;
      }

      function sizeDigits(symbol) {
        return SIZE_DECIMALS[baseAsset(symbol)] || 3;
      }

      function naturalSize(raw, symbol, botId) {
        const digits = sizeDigits(symbol);
        const q = 10 ** digits;
        if (!Number.isFinite(raw) || raw <= 0) return 1 / q;
        let n = Math.round(raw * q) / q;
        const salt = (fnv1a(`NEEKO-size|${botId}|${baseAsset(symbol)}`) % 89) + 11;
        const units = Math.round(n * q);
        if (units % 100 === 0 || units % 10 === 0) n = (units + (salt % 9) + 1) / q;
        return n;
      }

      function roundPx(px, symbol) {
        const x = Number(px);
        if (!Number.isFinite(x)) return 0;
        const asset = baseAsset(symbol);
        if (asset === "BTC" || x >= 1000) return Math.round(x * 100) / 100;
        if (asset === "ETH" || x >= 100) return Math.round(x * 100) / 100;
        if (x >= 1) return Math.round(x * 10000) / 10000;
        return Math.round(x * 1e6) / 1e6;
      }

      function dirOf(st) {
        return st.side === "SHORT" ? -1 : 1;
      }

      function walletOf(st) {
        return Number(st.baseBalance) > 0 ? st.baseBalance : st.initialBalance;
      }

      function sizeBand(st) {
        const equity = walletOf(st);
        const mark = Number(st.mark) || 1;
        return {
          lo: (equity * 0.065) / mark,
          hi: (equity * 0.085) / mark,
        };
      }

      function clampSizeToBand(st, size) {
        const { lo, hi } = sizeBand(st);
        return naturalSize(Math.min(hi, Math.max(lo, size)), st.symbol, st.id);
      }

      function notionalPct(st) {
        const w = walletOf(st);
        return w > 0 ? (st.size * st.mark) / w : 0;
      }

      function clampExposure(x) {
        const n = Number(x);
        if (!Number.isFinite(n)) return 0.075;
        return Math.min(0.085, Math.max(0.065, n));
      }

      function monthlyBand(strategy) {
        const s = String(strategy || "");
        if (/HFT|Maker Edge|Taker Sweep|Gamma Scalp|Dynamic HFT/i.test(s)) return [0.1, 0.12];
        if (/Low Risk|DQCNN|ATR|Deep Accumulation|Risk Parity|Drawdown|Circuit|Vol Target|Kelly/i.test(s)) return [0.05, 0.07];
        return [0.08, 0.1];
      }

      function dailyRate(st, dateStr = ymd()) {
        const [lo, hi] = monthlyBand(st.strategy);
        const u = fnv1a(`NEEKO-dayret|${dateStr}|${st.id}|${st.strategy}`) / 4294967295;
        const monthly = lo + u * (hi - lo);
        return Math.min(0.0038, Math.max(0.0016, monthly / 30));
      }

      function loadLedger() {
        try {
          const raw = localStorage.getItem(LEDGER_KEY);
          const data = raw ? JSON.parse(raw) : null;
          if (data && data.bots && typeof data.bots === "object") {
            ledgerCache = data;
            return data;
          }
        } catch (_err) {}
        ledgerCache = { bots: {} };
        return ledgerCache;
      }

      let persistTimer = 0;
      function flushLedger() {
        persistTimer = 0;
        try {
          localStorage.setItem(LEDGER_KEY, JSON.stringify(ledgerCache));
        } catch (_err) {}
      }

      function persistBot(st) {
        if (!st || !st.id) return;
        ledgerCache.bots[st.id] = {
          id: st.id,
          symbol: st.symbol,
          baseBalance: roundMoney(walletOf(st)),
          entry: Number(st.entry) || 0,
          size: Number(st.size) || 0,
          exposure: clampExposure(st.exposure),
          lastYmd: ymd(),
          lastSettleAt: Number(st.lastSettleAt) || Date.now(),
        };
        if (!persistTimer) persistTimer = setTimeout(flushLedger, 250);
      }

      function ymdToUtc(dateStr) {
        const [y, m, d] = String(dateStr || "").split("-").map(Number);
        if (!y || !m || !d) return null;
        return Date.UTC(y, m - 1, d);
      }

      function compoundMissedDays(st, balance, lastYmd) {
        let next = Number(balance);
        if (!(next > 0)) return next;
        const from = ymdToUtc(lastYmd);
        const today = ymdToUtc(ymd());
        if (from == null || today == null || today <= from) return roundMoney(next);
        const days = Math.min(370, Math.round((today - from) / 86400000));
        for (let i = 1; i <= days; i += 1) {
          const stamp = new Date(from + i * 86400000);
          next *= 1 + dailyRate(st, ymd(stamp));
        }
        return roundMoney(next);
      }

      function hydrateFromLedger(st) {
        const saved = ledgerCache.bots[st.id];
        if (!saved) return false;
        if (saved.symbol && String(saved.symbol).toUpperCase() !== String(st.symbol).toUpperCase()) return false;
        const bal = Number(saved.baseBalance);
        if (!(bal > 0)) return false;
        st.baseBalance = compoundMissedDays(st, bal, saved.lastYmd);
        st.lastSettleAt = Number(saved.lastSettleAt) || Date.now();
        return true;
      }

      function lockedSize(st) {
        const mark = Number(st.mark);
        const equity = walletOf(st);
        if (!(mark > 0) || !(equity > 0)) return 0;
        st.exposure = clampExposure(st.exposure);
        return (equity * st.exposure) / mark;
      }

      function resyncSize(st) {
        const mark = Number(st.mark);
        if (!(mark > 0)) return;
        st.size = clampSizeToBand(st, lockedSize(st));
        if (st.entry) st.liq = liqFromEntry(st.entry, st.side);
        refreshDerived(st);
      }

      function enforceBand(st) {
        const pct = notionalPct(st);
        if (pct > 0.085 || pct < 0.065) resyncSize(st);
      }

      function theoreticalPnl(st) {
        const mark = Number(st.mark);
        const entry = Number(st.entry);
        const size = Number(st.size);
        if (!(mark > 0) || !(entry > 0) || !(size > 0)) return 0;
        return (mark - entry) * size * dirOf(st);
      }

      function refreshDerived(st) {
        const pnl = theoreticalPnl(st);
        const entry = Number(st.entry);
        const size = Number(st.size);
        const margin = (size * entry) / (st.leverage || 8);
        st.pnl = pnl;
        st.margin = margin;
        st.roi = margin > 0 ? (pnl / margin) * 100 : 0;
      }

      function seedBooks(st) {
        hydrateFromLedger(st);
        st.baseBalance = clockBalance(st);
        st.exposure = clockExposure(st);
        resyncSize(st);
        persistBot(st);
      }

      function fmt(n, digits) {
        const x = Number(n);
        if (!Number.isFinite(x)) return "--";
        if (digits != null) {
          return x.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
        }
        if (Math.abs(x) >= 1000) return x.toLocaleString("en-US", { maximumFractionDigits: 2 });
        if (Math.abs(x) >= 1) return x.toLocaleString("en-US", { maximumFractionDigits: 4 });
        return x.toLocaleString("en-US", { maximumFractionDigits: 6 });
      }

      function baseAsset(symbol) {
        const s = String(symbol || "").toUpperCase();
        const raw = s.endsWith("USDT") ? s.slice(0, -4) : s.endsWith("BUSD") ? s.slice(0, -4) : s.endsWith("USDC") ? s.slice(0, -4) : s;
        return MAJOR_ASSETS.includes(raw) ? raw : "BTC";
      }

      function fmtSize(size, symbol) {
        const asset = baseAsset(symbol);
        const n = Number(size);
        const digits = sizeDigits(symbol);
        if (!Number.isFinite(n) || n <= 0) return `-- ${asset}`;
        return `${n.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits })} ${asset}`;
      }

      function bumpFlash(el, kind, extra) {
        if (!el) return;
        const base = extra || "";
        el.className = base;
        if (!kind) return;
        el.classList.remove("flash-up", "flash-down", "flash");
        void el.offsetWidth;
        el.classList.add(kind);
      }

      function nowStamp() {
        return new Date().toLocaleTimeString("zh-CN", { hour12: false });
      }

      function mapKlines(rows) {
        if (!Array.isArray(rows)) return [];
        return rows
          .map((row) => ({
            time: Math.floor(Number(row[0]) / 1000),
            open: Number(row[1]),
            high: Number(row[2]),
            low: Number(row[3]),
            close: Number(row[4]),
          }))
          .filter((bar) => Number.isFinite(bar.time) && Number.isFinite(bar.open) && Number.isFinite(bar.close))
          .slice(-180);
      }

      function upsertBarList(bars, bar) {
        if (!Array.isArray(bars) || !bar) return bars || [];
        const last = bars[bars.length - 1];
        if (!last || bar.time > last.time) {
          bars.push(bar);
          if (bars.length > 200) bars.shift();
        } else if (bar.time === last.time) {
          bars[bars.length - 1] = { ...last, ...bar, time: last.time };
        }
        return bars;
      }

      function cacheKlineBar(symbol, interval, bar) {
        const key = `${symbol}|${chartTf(interval)}`;
        const current = klineCache.get(key);
        if (!current) {
          klineCache.set(key, [bar]);
          return;
        }
        upsertBarList(current, bar);
      }

      function drawCanvasKline(canvas, bars, lastPrice, prevPrice) {
        const ctx = canvas.getContext("2d");
        if (!ctx || !bars.length) return;
        const dpr = window.devicePixelRatio || 1;
        const w = canvas.clientWidth || 1;
        const h = canvas.clientHeight || 1;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#070b12";
        ctx.fillRect(0, 0, w, h);
        let min = Infinity;
        let max = -Infinity;
        for (const bar of bars) {
          min = Math.min(min, bar.low);
          max = Math.max(max, bar.high);
        }
        const live = Number(lastPrice);
        if (live > 0) {
          min = Math.min(min, live);
          max = Math.max(max, live);
        }
        const pad = (max - min) * 0.06 || min * 0.01;
        min -= pad;
        max += pad;
        const span = max - min || 1;
        const n = bars.length;
        const labelW = 52;
        const plotW = Math.max(8, w - labelW);
        const slot = plotW / n;
        const bodyW = Math.max(0.6, Math.min(2.4, slot * 0.62));
        for (let i = 0; i < n; i += 1) {
          const bar = bars[i];
          const x = i * slot + slot / 2;
          const yH = ((max - bar.high) / span) * h;
          const yL = ((max - bar.low) / span) * h;
          const yO = ((max - bar.open) / span) * h;
          const yC = ((max - bar.close) / span) * h;
          const up = bar.close >= bar.open;
          ctx.strokeStyle = up ? "#26a69a" : "#ef5350";
          ctx.fillStyle = up ? "#26a69a" : "#ef5350";
          ctx.beginPath();
          ctx.moveTo(x, yH);
          ctx.lineTo(x, yL);
          ctx.lineWidth = 1;
          ctx.stroke();
          const top = Math.min(yO, yC);
          const bh = Math.max(1, Math.abs(yC - yO));
          ctx.fillRect(x - bodyW / 2, top, bodyW, bh);
        }
      }

      function drawPriceTag(ctx, plotW, w, h, min, max, price, prevPrice) {
        const span = max - min || 1;
        const y = ((max - price) / span) * h;
        const up = !(Number(prevPrice) > 0) || price >= prevPrice;
        const color = up ? "#26a69a" : "#ef5350";
        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.95;
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(plotW, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;
        const label = fmt(price);
        ctx.font = "600 9px ui-sans-serif, system-ui, -apple-system, sans-serif";
        const padX = 5;
        const tw = ctx.measureText(label).width;
        const bw = Math.max(44, tw + padX * 2);
        const bh = 14;
        const bx = w - bw - 1;
        const by = Math.min(h - bh - 1, Math.max(1, y - bh / 2));
        ctx.fillStyle = color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 2);
        else ctx.rect(bx, by, bw, bh);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(plotW, y);
        ctx.lineTo(bx, y);
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.textBaseline = "middle";
        ctx.textAlign = "center";
        ctx.fillText(label, bx + bw / 2, by + bh / 2 + 0.5);
        ctx.restore();
      }

      function queueCanvas(id) {
        dirtyCanvas.add(id);
        if (canvasRaf) return;
        canvasRaf = requestAnimationFrame(() => {
          canvasRaf = 0;
          for (const cid of dirtyCanvas) {
            const handle = charts.get(cid);
            if (handle?.canvas) drawCanvasKline(handle.canvas, handle.bars, handle.lastPrice, handle.prevPrice);
          }
          dirtyCanvas.clear();
        });
      }

      function destroyChart(id) {
        const handle = charts.get(id);
        const root = phones.get(id);
        const host = (handle && handle.host) || (root && root.querySelector("[data-chart]"));
        if (handle) {
          try { handle.ro?.disconnect(); } catch (_err) {}
          try {
            if (handle.priceLine && handle.series && typeof handle.series.removePriceLine === "function") {
              handle.series.removePriceLine(handle.priceLine);
            }
          } catch (_err) {}
          handle.priceLine = null;
          try { handle.chart?.remove(); } catch (_err) {}
          handle.chart = null;
          handle.series = null;
        }
        if (host) host.innerHTML = "";
        if (root) {
          root.querySelectorAll("[data-price-tag]").forEach((el) => el.remove());
        }
        charts.delete(id);
      }

      function applyChartChrome(chart) {
        if (!chart) return;
        try {
          chart.applyOptions({
            grid: {
              vertLines: { visible: false },
              horzLines: { visible: false },
            },
            rightPriceScale: {
              visible: true,
              width: 65,
              borderVisible: false,
              entireTextOnly: false,
            },
          });
        } catch (_err) {}
        try {
          chart.priceScale("right").applyOptions({
            visible: true,
            width: 65,
            minimumWidth: 65,
            borderVisible: false,
            entireTextOnly: false,
            textColor: "#ffffff",
          });
        } catch (_err) {}
      }

      function createLightweight(host, bars) {
        if (!host || typeof LightweightCharts === "undefined" || !LightweightCharts.createChart) return null;
        try { host.innerHTML = ""; } catch (_err) {}
        try {
          const chart = LightweightCharts.createChart(host, {
            layout: {
              background: { type: "solid", color: "#070b12" },
              textColor: "#e2e8f0",
              fontSize: 10,
              attributionLogo: false,
            },
            grid: {
              vertLines: { visible: false },
              horzLines: { visible: false },
            },
            rightPriceScale: {
              visible: true,
              width: 65,
              borderVisible: false,
              entireTextOnly: false,
            },
            timeScale: {
              visible: false,
              borderVisible: false,
              timeVisible: false,
              secondsVisible: false,
              barSpacing: 1.8,
              minBarSpacing: 0.55,
              rightOffset: 18,
              fixLeftEdge: false,
              fixRightEdge: false,
            },
            crosshair: { vertLine: { visible: false }, horzLine: { visible: false } },
            handleScroll: false,
            handleScale: false,
            kineticScroll: { mouse: false, touch: false },
          });
          applyChartChrome(chart);
          const series = chart.addCandlestickSeries({
            upColor: "#26a69a",
            downColor: "#ef5350",
            borderVisible: false,
            wickUpColor: "#26a69a",
            wickDownColor: "#ef5350",
            lastValueVisible: true,
            priceLineVisible: true,
            priceLineWidth: 1,
            priceLineColor: "#26a69a",
            priceFormat: { type: "price", precision: 4, minMove: 0.0001 },
          });
          series.applyOptions({
            lastValueVisible: false,
            priceLineVisible: false,
          });
          applyChartChrome(chart);
          if (bars.length) series.setData(bars);
          let lastPriceSeries = null;
          try {
            lastPriceSeries = chart.addLineSeries({
              color: "#26a69a",
              lineVisible: true,
              lineWidth: 2,
              lastValueVisible: true,
              priceLineVisible: true,
              priceLineWidth: 1,
              priceLineStyle: 2,
              crosshairMarkerVisible: false,
              priceFormat: { type: "price", precision: 4, minMove: 0.0001 },
            });
            lastPriceSeries.applyOptions({
              lastValueVisible: true,
              priceLineVisible: true,
            });
            const last = bars[bars.length - 1];
            if (last) lastPriceSeries.setData([{ time: last.time, value: last.close }]);
          } catch (_lineErr) {
            lastPriceSeries = null;
          }
          const rect = host.getBoundingClientRect();
          chart.applyOptions({
            width: Math.max(1, rect.width),
            height: Math.max(1, rect.height),
            grid: {
              vertLines: { visible: false },
              horzLines: { visible: false },
            },
            rightPriceScale: {
              visible: true,
              width: 65,
              borderVisible: false,
              entireTextOnly: false,
            },
          });
          chart.timeScale().fitContent();
          return { chart, series, lastPriceSeries };
        } catch (_err) {
          try { host.innerHTML = ""; } catch (_e) {}
          return null;
        }
      }

      function ensurePriceTag(root) {
        const box = root && root.querySelector(".chart-box");
        if (!box) return null;
        const tags = box.querySelectorAll("[data-price-tag]");
        for (let i = 1; i < tags.length; i += 1) tags[i].remove();
        let tag = box.querySelector("[data-price-tag]");
        if (tag) return tag;
        tag = document.createElement("div");
        tag.setAttribute("data-price-tag", "");
        tag.className = "chart-price-tag";
        box.appendChild(tag);
        return tag;
      }

      function paintPriceTag(slot, price, prevPrice) {
        const root = phones.get(slot);
        const handle = charts.get(slot);
        const tag = ensurePriceTag(root);
        if (!tag || !(Number(price) > 0)) return;
        if (handle && handle.lastPriceSeries) {
          tag.style.display = "none";
          return;
        }
        const up = !(Number(prevPrice) > 0) || price >= prevPrice;
        tag.textContent = fmt(price);
        tag.classList.toggle("down", !up);
        tag.style.display = "block";
        const box = handle?.host || root.querySelector("[data-chart]") || handle?.canvas;
        const h = box && box.clientHeight > 8 ? box.clientHeight : 0;
        const bars = (handle && handle.bars) || [];
        if (h && bars.length) {
          let min = Infinity;
          let max = -Infinity;
          for (const bar of bars) {
            min = Math.min(min, bar.low);
            max = Math.max(max, bar.high);
          }
          min = Math.min(min, price);
          max = Math.max(max, price);
          const pad = (max - min) * 0.06 || min * 0.01;
          min -= pad;
          max += pad;
          const span = max - min || 1;
          const y = ((max - price) / span) * h;
          tag.style.top = `${Math.max(8, Math.min(h - 14, y))}px`;
          tag.style.transform = "translateY(-50%)";
        }
      }

      function applyLivePriceToChart(id, px) {
        const slot = slotOfBot(id);
        if (!slot) return;
        const handle = charts.get(slot);
        if (!handle || !(Number(px) > 0)) return;
        const price = Number(px);
        const prev = Number(handle.lastPrice) > 0 ? handle.lastPrice : price;
        handle.prevPrice = prev;
        handle.lastPrice = price;
        paintPriceTag(slot, price, prev);
        const t = Math.floor(Date.now() / 1000);
        const point = { time: t, value: price };
        if (handle.lastPriceSeries) {
          if (!Array.isArray(handle.livePoints)) handle.livePoints = [];
          const pts = handle.livePoints;
          if (pts.length && pts[pts.length - 1].time === t) pts[pts.length - 1] = point;
          else pts.push(point);
          if (pts.length > 240) pts.splice(0, pts.length - 240);
          try {
            handle.lastPriceSeries.update(point);
          } catch (_err) {
            try { handle.lastPriceSeries.setData(pts.slice()); } catch (_e) {}
          }
          const up = price >= prev;
          try {
            handle.lastPriceSeries.applyOptions({
              lastValueVisible: true,
              priceLineVisible: true,
              lineVisible: true,
              priceLineColor: up ? "#26a69a" : "#ef5350",
              color: up ? "#26a69a" : "#ef5350",
            });
            handle.chart?.applyOptions({
              rightPriceScale: {
                visible: true,
                width: 65,
              },
            });
          } catch (_err) {}
          try { handle.chart?.timeScale().scrollToRealTime(); } catch (_err) {}
        }
        if (handle.series && handle.last) {
          const nextBar = {
            time: handle.last.time,
            open: handle.last.open,
            high: Math.max(handle.last.high, price),
            low: Math.min(handle.last.low, price),
            close: price,
          };
          handle.last = nextBar;
          if (Array.isArray(handle.bars) && handle.bars.length) {
            handle.bars[handle.bars.length - 1] = nextBar;
          }
          try { handle.series.update(nextBar); } catch (_err3) {}
        }
        if (handle.canvas) queueCanvas(slot);
      }

      function queueLiveTick(symbol, px) {
        const sym = String(symbol || "").toUpperCase();
        const price = Number(px);
        if (!sym || !(price > 0)) return;
        liveMarkBySymbol.set(sym, price);
        liveTickBuf.set(sym, price);
        if (liveTickRaf) return;
        liveTickRaf = requestAnimationFrame(() => {
          liveTickRaf = 0;
          const batch = Array.from(liveTickBuf.entries());
          liveTickBuf.clear();
          for (let i = 0; i < batch.length; i += 1) {
            flushLiveTick(batch[i][0], batch[i][1]);
          }
        });
      }

      function flushLiveTick(sym, px) {
        for (let view = 1; view <= PAGE_SIZE; view += 1) {
          const id = botIdOfSlot(view);
          const st = botState.get(id);
          if (!st || String(st.symbol).toUpperCase() !== sym) continue;
          const prevPnl = Number(st.pnl) || 0;
          st.mark = roundPx(px, st.symbol);
          if (!st.entry) {
            st.entry = canonicalEntry(st);
            st.liq = liqFromEntry(st.entry, st.side);
            seedBooks(st);
            st.seeded = true;
          }
          refreshDerived(st);
          st.lastPnlDir = st.pnl > prevPnl + 0.01 ? 1 : st.pnl < prevPnl - 0.01 ? -1 : 0;
          applyLivePriceToChart(id, px);
          paint(id, { pnlDir: st.lastPnlDir || 0 });
        }
      }

      async function loadKlines(symbol, interval) {
        const key = `${symbol}|${interval}`;
        if (klineCache.has(key)) return klineCache.get(key).slice();
        if (klineInflight.has(key)) return klineInflight.get(key);
        const job = (async () => {
          try {
            const res = await fetch(`/api/klines?symbol=${encodeURIComponent(symbol)}&interval=${interval}&limit=180`, { credentials: "include" });
            const json = await res.json();
            const bars = mapKlines(json.klines);
            if (bars.length) {
              klineCache.set(key, bars);
              return bars.slice();
            }
          } catch (_err) {}
          try {
            const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${encodeURIComponent(symbol)}&interval=${interval}&limit=180`);
            const rows = await res.json();
            const bars = mapKlines(rows);
            if (bars.length) {
              klineCache.set(key, bars);
              return bars.slice();
            }
          } catch (_err) {}
          try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${encodeURIComponent(symbol)}&interval=${interval}&limit=180`);
            const rows = await res.json();
            const bars = mapKlines(rows);
            if (bars.length) {
              klineCache.set(key, bars);
              return bars.slice();
            }
          } catch (_err) {}
          return [];
        })();
        klineInflight.set(key, job);
        try {
          return await job;
        } finally {
          klineInflight.delete(key);
        }
      }

      async function mountChart(slot, symbol, interval, mark) {
        const root = phones.get(slot);
        if (!root) return;
        const seq = (Number(chartMountSeq.get(slot)) || 0) + 1;
        chartMountSeq.set(slot, seq);
        const host = root.querySelector("[data-chart]");
        destroyChart(slot);
        if (host) host.innerHTML = "";
        const badge = root.querySelector("[data-badge]");
        if (badge) badge.textContent = `${baseAsset(symbol)} · ${chartTf(interval)}`;
        const tf = chartTf(interval);
        const bars = (await loadKlines(symbol, tf)) || [];
        if (chartMountSeq.get(slot) !== seq) return;
        if (!phones.get(slot) || phones.get(slot) !== root) return;
        destroyChart(slot);
        if (host) host.innerHTML = "";
        const lw = createLightweight(host, bars);
        const handle = {
          host,
          symbol: String(symbol || "").toUpperCase(),
          interval: tf,
          bars,
          last: bars[bars.length - 1],
          lastPrice: Number(mark) > 0 ? Number(mark) : liveMarkOf(symbol),
          prevPrice: 0,
          chart: lw?.chart || null,
          series: lw?.series || null,
          lastPriceSeries: lw?.lastPriceSeries || null,
          priceLine: null,
          canvas: null,
          livePoints: [],
        };
        if (handle.lastPriceSeries) {
          const t0 = Math.floor(Date.now() / 1000);
          const v0 = Number(handle.lastPrice) > 0 ? handle.lastPrice : Number(handle.last && handle.last.close) || 0;
          if (v0 > 0) {
            handle.livePoints = [{ time: t0, value: v0 }];
            try { handle.lastPriceSeries.setData(handle.livePoints); } catch (_err) {}
          }
        }
        if (handle.series) {
          try {
            handle.series.applyOptions({
              lastValueVisible: false,
              priceLineVisible: false,
            });
            if (handle.lastPriceSeries) {
              handle.lastPriceSeries.applyOptions({
                lastValueVisible: true,
                priceLineVisible: true,
              });
            }
            applyChartChrome(handle.chart);
          } catch (_err) {}
        } else {
          const canvas = document.createElement("canvas");
          canvas.style.width = "100%";
          canvas.style.height = "100%";
          host.appendChild(canvas);
          handle.canvas = canvas;
          drawCanvasKline(canvas, bars, handle.lastPrice, handle.prevPrice);
        }
        if (chartMountSeq.get(slot) !== seq) {
          try { handle.ro?.disconnect(); } catch (_err) {}
          try { handle.chart?.remove(); } catch (_err) {}
          if (host) host.innerHTML = "";
          return;
        }
        handle.ro = new ResizeObserver(() => {
          if (handle.chart) {
            const rect = host.getBoundingClientRect();
            handle.chart.applyOptions({
              width: Math.max(1, rect.width),
              height: Math.max(1, rect.height),
              grid: {
                vertLines: { visible: false },
                horzLines: { visible: false },
              },
              rightPriceScale: {
                visible: true,
                width: 65,
              },
            });
            applyChartChrome(handle.chart);
          } else if (handle.canvas) {
            queueCanvas(slot);
          }
        });
        handle.ro.observe(host);
        charts.set(slot, handle);
        const botId = botIdOfSlot(slot);
        const livePx = Number(handle.lastPrice) > 0 ? handle.lastPrice : liveMarkOf(symbol);
        if (botId && livePx > 0) applyLivePriceToChart(botId, livePx);
      }

      function applyBinanceKline(symbol, interval, bar, closed) {
        const sym = String(symbol || "").toUpperCase();
        const tf = chartTf(interval);
        cacheKlineBar(sym, tf, bar);
        for (let view = 1; view <= PAGE_SIZE; view += 1) {
          const id = botIdOfSlot(view);
          const st = botState.get(id);
          if (!st) continue;
          if (String(st.symbol).toUpperCase() !== sym) continue;
          if (chartTf(st.interval) !== tf) continue;
          applyKlineBar(id, bar, closed);
        }
      }

      async function bootstrapMarks() {
        try {
          const res = await fetch("https://fapi.binance.com/fapi/v1/premiumIndex");
          const rows = await res.json();
          if (!Array.isArray(rows)) return;
          for (const row of rows) {
            const px = Number(row.markPrice);
            if (row.symbol && px > 0) liveMarkBySymbol.set(String(row.symbol).toUpperCase(), px);
          }
        } catch (_err) {}
      }

      function applyKlineBar(botId, bar, closed) {
        const slot = slotOfBot(botId);
        if (!slot) return;
        const handle = charts.get(slot);
        if (!handle || !bar) return;
        if (!Array.isArray(handle.bars)) handle.bars = [];
        const last = handle.last;
        if (!last || bar.time > last.time) {
          handle.bars.push(bar);
          if (handle.bars.length > 200) handle.bars.shift();
          handle.last = bar;
        } else {
          handle.last = { ...last, ...bar, time: last.time };
          handle.bars[handle.bars.length - 1] = handle.last;
        }
        if (handle.series) {
          try { handle.series.update(handle.last); } catch (_err) {}
          if (closed) handle.chart?.timeScale().scrollToRealTime();
        } else if (handle.canvas) {
          queueCanvas(slot);
        }
      }

      function pushLog(id, text, stamp) {
        const st = botState.get(id);
        if (!st) return;
        const ts = stamp || nowStamp();
        st.logs = st.logs || [];
        st.logs.push(`[${ts}] ${text}`);
        st.logs = st.logs.slice(-6);
        const root = phones.get(slotOfBot(id));
        if (!root) return;
        const box = root.querySelector("[data-log]");
        box.innerHTML = st.logs
          .map((line, i) => `<div class="${i === st.logs.length - 1 ? "flash" : ""}">${line}</div>`)
          .join("");
        box.scrollTop = box.scrollHeight;
      }

      function fallbackMark(symbol) {
        const px = Number(FIXED_MARKS[String(symbol || "").toUpperCase()]);
        return Number.isFinite(px) && px > 0 ? px : Number(FIXED_MARKS.BTCUSDT);
      }

      function applyMark(st, px) {
        if (!st || !Number.isFinite(px) || px <= 0) return false;
        const next = roundPx(px, st.symbol);
        if (st.mark === next) return false;
        const prevPnl = st.pnl;
        st.mark = next;
        if (!st.entry) {
          st.entry = canonicalEntry(st);
          st.liq = liqFromEntry(st.entry, st.side);
          seedBooks(st);
          st.seeded = true;
          refreshDerived(st);
          if (slotOfBot(st.id)) applyLivePriceToChart(st.id, next);
          return true;
        }
        refreshDerived(st);
        st.lastPnlDir = st.pnl > prevPnl + 0.01 ? 1 : st.pnl < prevPnl - 0.01 ? -1 : 0;
        if (slotOfBot(st.id)) applyLivePriceToChart(st.id, next);
        return true;
      }

      function syncClock(st, t = unixSec()) {
        if (!st) return;
        const live = liveMarkOf(st.symbol);
        if (live) st.mark = roundPx(live, st.symbol);
        else if (!(Number(st.mark) > 0)) st.mark = fallbackMark(st.symbol);
        st.baseBalance = clockBalance(st, t);
        st.exposure = clockExposure(st, t);
        if (!(Number(st.entry) > 0)) st.entry = canonicalEntry(st);
        if (st.entry) st.liq = liqFromEntry(st.entry, st.side);
        refreshDerived(st);
        if (slotOfBot(st.id) && Number(st.mark) > 0) applyLivePriceToChart(st.id, st.mark);
      }

      function seedPosition(st) {
        if (st.seeded && st.entry && st.size) {
          syncClock(st);
          return;
        }
        st.entry = canonicalEntry(st);
        st.liq = liqFromEntry(st.entry, st.side);
        seedBooks(st);
        syncClock(st);
        st.seeded = true;
        persistBot(st);
      }

      function paint(id, flags = {}) {
        const root = phones.get(slotOfBot(id));
        const st = botState.get(id);
        if (!root || !st) return;
        root.querySelector("[data-headline]").textContent = `${st.name} ${st.symbol}`;
        root.querySelector("[data-tag]").textContent = `[${st.strategy}]`;
        const runEl = root.querySelector("[data-run]");
        if (runEl) runEl.textContent = st.runtimeLabel || "";
        seedPosition(st);
        if (!st.mark || !st.entry) return;
        refreshDerived(st);
        const pnl = st.pnl;
        const roi = st.roi;
        const tone = pnl >= 0 ? "up" : "down";
        const muted = reloadingIds.has(id);
        const pnlKind = muted ? "" : flags.pnlDir > 0 ? "flash-up" : flags.pnlDir < 0 ? "flash-down" : "";
        const balKind = muted ? "" : flags.balDir > 0 ? "flash-up" : flags.balDir < 0 ? "flash-down" : "";
        const sizeKind = muted ? "" : flags.sizeChanged ? (flags.sizeDir >= 0 ? "flash-up" : "flash-down") : "";
        const balEl = root.querySelector("[data-balance]");
        const pnlEl = root.querySelector("[data-pnl]");
        const roiEl = root.querySelector("[data-roi]");
        const sizeEl = root.querySelector("[data-size]");
        const markEl = root.querySelector("[data-mark]");
        balEl.textContent = `$${fmt(st.baseBalance, 2)} USDT`;
        bumpFlash(balEl, balKind, "text-white");
        pnlEl.textContent = `${pnl >= 0 ? "+" : ""}$${fmt(Math.abs(pnl), 2)}`;
        bumpFlash(pnlEl, pnlKind, `leading-none ${tone}`);
        roiEl.textContent = `${roi >= 0 ? "+" : ""}${roi.toFixed(2)}%`;
        bumpFlash(roiEl, pnlKind, `leading-none ${tone}`);
        markEl.textContent = fmt(st.mark);
        markEl.className = "text-cyan-300";
        if (slotOfBot(id) && Number(st.mark) > 0) applyLivePriceToChart(id, st.mark);
        const entryEl = root.querySelector("[data-entry]");
        const liqEl = root.querySelector("[data-liq]");
        entryEl.textContent = fmt(st.entry);
        liqEl.textContent = fmt(st.liq);
        entryEl.className = "text-slate-100";
        liqEl.className = "text-amber-300";
        const unit = baseAsset(st.symbol);
        const unitEl = root.querySelector("[data-unit]");
        if (unitEl) unitEl.textContent = `(${unit})`;
        sizeEl.textContent = fmtSize(st.size, st.symbol);
        bumpFlash(sizeEl, sizeKind, "text-slate-100");
        const box = root.querySelector("[data-log]");
        if (box) {
          const lines = st.logs || [];
          box.innerHTML = lines
            .map((line, i) => `<div class="${i === lines.length - 1 ? "flash" : ""}">${line}</div>`)
            .join("");
          box.scrollTop = box.scrollHeight;
        }
      }

      function localSlots() {
        return Array.from({ length: BOT_COUNT }, (_, i) => ({ id: i + 1 }));
      }

      let chartGen = 0;
      function pumpChartQueue() {
        const gen = ++chartGen;
        let cursor = 0;
        const step = async () => {
          if (gen !== chartGen) return;
          cursor += 1;
          if (cursor > PAGE_SIZE) return;
          const botId = botIdOfSlot(cursor);
          const st = botState.get(botId);
          if (st) await mountChart(cursor, st.symbol, st.interval, st.mark || fallbackMark(st.symbol));
          if (gen !== chartGen) return;
          setTimeout(step, 16);
        };
        step();
      }

      function highlightGroupTabs() {
        document.querySelectorAll(".group-tab").forEach((btn, i) => {
          btn.classList.toggle("active", i === groupIndex);
        });
      }

      function selectGroup(g) {
        if (g === groupIndex || g < 0 || g >= GROUP_COUNT) return;
        groupIndex = g;
        reloadingIds.clear();
        for (const el of phones.values()) {
          const mask = el.querySelector("[data-reload-mask]");
          if (!mask) continue;
          mask.style.opacity = "0";
          mask.style.visibility = "hidden";
        }
        highlightGroupTabs();
        for (let slot = 1; slot <= PAGE_SIZE; slot += 1) {
          const botId = botIdOfSlot(slot);
          const st = botState.get(botId);
          if (!st) continue;
          seedPosition(st);
          paint(botId);
        }
        pumpChartQueue();
      }

      function buildGroupBar() {
        const bar = document.getElementById("group-bar");
        if (!bar) return;
        bar.innerHTML = "";
        for (let g = 0; g < GROUP_COUNT; g += 1) {
          const start = g * PAGE_SIZE + 1;
          const end = start + PAGE_SIZE - 1;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "group-tab" + (g === 0 ? " active" : "");
          btn.textContent = `Group ${GROUP_LETTERS[g]} (${start}-${end})`;
          btn.addEventListener("click", () => selectGroup(g));
          bar.appendChild(btn);
        }
      }

      async function applyConfig(slots) {
        slotsCache = (slots || localSlots()).map(safeSlot);
        if (slotsCache.length !== BOT_COUNT) slotsCache = localSlots().map(safeSlot);
        await bootstrapMarks();
        for (let index = 0; index < slotsCache.length; index += 1) {
          const slot = slotsCache[index];
          const prev = botState.get(slot.id);
          const changed = !prev || prev.symbol !== slot.symbol || prev.interval !== slot.interval || prev.strategy !== slot.strategy;
          if (changed) {
            botState.set(slot.id, {
              ...slot,
              entry: null,
              mark: 0,
              size: 0,
              seeded: false,
              baseBalance: slot.initialBalance,
              lastSettleAt: Date.now(),
              logs: prev?.logs || [],
            });
          } else {
            const keepBal = prev.baseBalance;
            const keepEntry = prev.entry;
            const keepSize = prev.size;
            const keepSeeded = prev.seeded;
            const keepSettle = prev.lastSettleAt;
            const keepExp = prev.exposure;
            const keepLiq = prev.liq;
            Object.assign(prev, slot);
            prev.baseBalance = keepBal;
            prev.entry = keepEntry;
            prev.size = keepSize;
            prev.seeded = keepSeeded;
            prev.lastSettleAt = keepSettle;
            prev.exposure = keepExp;
            prev.liq = keepLiq;
          }
          const st = botState.get(slot.id);
          seedPosition(st);
          if (slotOfBot(slot.id)) {
            paint(slot.id);
            if (changed) pushLog(slot.id, composeExecLog(botState.get(slot.id), "open"));
          }
        }
        pumpChartQueue();
        connectMarket();
        startLogEngine();
        startTradeEngine();
        startMarkPulse();
        startReloadEngine();
      }

      function closeMarketSocket() {
        if (marketReconnectTimer) {
          clearTimeout(marketReconnectTimer);
          marketReconnectTimer = 0;
        }
        if (!marketWs) return;
        const ws = marketWs;
        marketWs = null;
        ws.onopen = null;
        ws.onmessage = null;
        ws.onerror = null;
        ws.onclose = null;
        try { ws.close(); } catch (_err) {}
      }

      function connectMarket() {
        closeMarketSocket();
        const gen = ++marketWsGeneration;
        let gotTick = false;
        const parts = [];
        const seen = new Set();
        const add = (stream) => {
          if (seen.has(stream)) return;
          seen.add(stream);
          parts.push(stream);
        };
        for (const asset of MAJOR_ASSETS) {
          const s = `${asset.toLowerCase()}usdt`;
          add(`${s}@aggTrade`);
          add(`${s}@kline_1m`);
          add(`${s}@kline_3m`);
          if (marketFeedKind === "futures") add(`${s}@markPrice@1s`);
        }
        if (!parts.length) return;
        const base = marketFeedKind === "spot"
          ? "wss://stream.binance.com:9443/stream"
          : "wss://fstream.binance.com/stream";
        marketWs = new WebSocket(`${base}?streams=${parts.join("/")}`);
        marketWs.onopen = () => {
          if (gen !== marketWsGeneration) return;
          lastWsAt = Date.now();
          document.getElementById("link-status").textContent = "LIVE CONNECTED · MARK PRICE 1s / LIGHTWEIGHT CHART";
        };
        marketWs.onmessage = (event) => {
          if (gen !== marketWsGeneration) return;
          lastWsAt = Date.now();
          let msg;
          try { msg = JSON.parse(event.data); } catch (_err) { return; }
          const data = msg.data || msg;
          if (data.e === "aggTrade" || data.e === "trade") {
            gotTick = true;
            queueLiveTick(data.s, data.p);
            return;
          }
          if (data.e === "markPriceUpdate") {
            gotTick = true;
            queueLiveTick(data.s, data.p);
            return;
          }
          if (data.e === "kline" && data.k) {
            gotTick = true;
            const k = data.k;
            applyBinanceKline(data.s || k.s, k.i, {
              time: Math.floor(Number(k.t) / 1000),
              open: Number(k.o),
              high: Number(k.h),
              low: Number(k.l),
              close: Number(k.c),
            }, Boolean(k.x));
            queueLiveTick(data.s || k.s, k.c);
          }
        };
        marketWs.onerror = () => {
          if (gen !== marketWsGeneration) return;
          try { marketWs && marketWs.close(); } catch (_err) {}
        };
        marketWs.onclose = () => {
          if (gen !== marketWsGeneration) return;
          document.getElementById("link-status").textContent = "RECONNECTING MARKET FEED...";
          if (!gotTick && marketFeedKind === "futures") marketFeedKind = "spot";
          marketReconnectTimer = setTimeout(() => {
            if (gen !== marketWsGeneration) return;
            connectMarket();
          }, 1200);
        };
      }

      window.addEventListener("pagehide", () => {
        marketWsGeneration += 1;
        closeMarketSocket();
      });
      window.addEventListener("beforeunload", () => {
        marketWsGeneration += 1;
        closeMarketSocket();
      });

      function pulseLastClose(id, price) {
        const slot = slotOfBot(id);
        if (!slot) return;
        const handle = charts.get(slot);
        if (!handle || !handle.last || !Number.isFinite(price) || price <= 0) return;
        const last = handle.last;
        const next = {
          time: last.time,
          open: last.open,
          high: Math.max(last.high, price),
          low: Math.min(last.low, price),
          close: price,
        };
        handle.last = next;
        handle.bars[handle.bars.length - 1] = next;
        if (handle.series) {
          try { handle.series.update(next); } catch (_err) {}
        } else if (handle.canvas) {
          queueCanvas(slot);
        }
      }

      function startLogEngine() {
        if (logsStarted) return;
        logsStarted = true;
        for (let id = 1; id <= BOT_COUNT; id += 1) {
          const kick = 200 + ((id * 37) % 11000) + (fnv1a(`logkick|${id}`) % 900);
          const loop = () => {
            const delay = 3000 + (fnv1a(`loggap|${id}|${unixSec()}`) % 9001);
            setTimeout(() => {
              const st = botState.get(id);
              if (st && st.seeded) pushLog(id, composeExecLog(st, "tick"));
              loop();
            }, delay);
          };
          setTimeout(loop, kick);
        }
      }

      function startMarkPulse() {
        if (markPulseStarted) return;
        markPulseStarted = true;
        setInterval(() => {
          const t = unixSec();
          for (let view = 1; view <= PAGE_SIZE; view += 1) {
            const id = botIdOfSlot(view);
            const st = botState.get(id);
            if (!st || !st.seeded) continue;
            const prevPnl = st.pnl;
            syncClock(st, t);
            st.lastPnlDir = st.pnl > prevPnl + 0.01 ? 1 : st.pnl < prevPnl - 0.01 ? -1 : 0;
            paint(id, { pnlDir: st.lastPnlDir || 0 });
          }
        }, 1000);
      }

      function padBot(id) {
        return String(id).padStart(4, "0");
      }

      function composeExecLog(st, kind) {
        if (!st) return "engine idle";
        st.logSeq = (st.logSeq || 0) + 1;
        const now = unixSec();
        const seq = st.logSeq;
        const salt = fnv1a(`${st.id}|${seq}|${now}|${st.symbol}|${kind || "tick"}`);
        const asset = baseAsset(st.symbol);
        const bot = `#${padBot(st.id)}`;
        const tag = st.strategy || "TTM";
        const side = st.side || "LONG";
        const mark = fmt(st.mark);
        const frac = 0.018 + (salt % 7200) / 100000;
        const rawQty = Math.max(Number(st.size) * frac, 1 / 10 ** sizeDigits(st.symbol));
        const qty = fmtSize(naturalSize(rawQty, st.symbol, st.id + seq), st.symbol);
        const pct = (6.5 + (salt % 2000) / 1000).toFixed(1);
        const ticket = `x${(salt % 900000 + 100000).toString(16)}`;
        const variants = [
          `${bot} ${asset} filled ${qty} · ${tag} ${side} ${ticket}`,
          `${bot} ${tag} signal confirmed on ${st.symbol} · ${qty} ${ticket}`,
          `${bot} risk check @ ${pct}% notional · ${asset} ${ticket}`,
          `${bot} ${side} ${kind === "close" ? "reduce" : "add"} ${qty} @ ${mark} ${ticket}`,
          `${bot} ${tag} hedge adjust ${qty} · liq ${fmt(st.liq)} ${ticket}`,
          `${bot} inventory skew ${asset} ${qty} · ${pct}% cap ${ticket}`,
          `${bot} ${st.symbol} maker fill ${qty} · ${tag} ${ticket}`,
          `${bot} TTM confirm ${asset} ${qty} · risk ${pct}% ${ticket}`,
        ];
        if (kind === "open") {
          return `${bot} session live ${st.runtimeLabel} · ${st.symbol} ${tag} ${ticket}`;
        }
        if (kind === "close") {
          return `${bot} ${tag} take-profit ${qty} · ${side} ${st.symbol} ${ticket}`;
        }
        if (kind === "risk") {
          return `${bot} 10% DD guard hold · risk check @ ${pct}% ${ticket}`;
        }
        return variants[salt % variants.length];
      }

      function tradeLog(st, qty) {
        return composeExecLog(st, "close");
      }

      function settleStep(st) {
        const saved = ledgerCache.bots[st.id];
        const lastYmd = saved?.lastYmd;
        if (lastYmd && lastYmd !== ymd()) {
          st.baseBalance = compoundMissedDays(st, walletOf(st), lastYmd);
        }
        const t = unixSec();
        const bucket = Math.floor(t / 20);
        const rng = tickRng(bucket, st.id, st.symbol, "settle");
        const before = walletOf(st);
        st.baseBalance = clockBalance(st, t);
        const win = rng() < 0.7;
        st.exposure = clockExposure(st, t);
        st.lastSettleAt = t * 1000;
        const beforeSize = st.size;
        resyncSize(st);
        persistBot(st);
        return { win: win || st.baseBalance >= before, sizeDelta: st.size - beforeSize };
      }

      function executeTrade(id) {
        const st = botState.get(id);
        if (!st || !st.seeded || !st.size || !st.mark) return;
        const stamp = nowStamp();
        const { win, sizeDelta } = settleStep(st);
        if (win) pushLog(id, tradeLog(st, Math.abs(sizeDelta) || st.size * 0.04), stamp);
        else pushLog(id, composeExecLog(st, "risk"), stamp);
        paint(id, { sizeChanged: true, sizeDir: sizeDelta >= 0 ? 1 : -1, balDir: win ? 1 : -1 });
      }

      function startTradeEngine() {
        if (tradeStarted) return;
        tradeStarted = true;
        const loop = () => {
          const t = unixSec();
          const delay = 15000 + Math.floor(seededUnit(Math.floor(t / 15), 0, "TRADE", "delay") * 15000);
          setTimeout(() => {
            const now = unixSec();
            const rng = tickRng(Math.floor(now / 20), 0, "TRADE", "pool");
            const pool = slotsCache.map((slot) => slot.id);
            for (let i = pool.length - 1; i > 0; i -= 1) {
              const j = Math.floor(rng() * (i + 1));
              [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            const n = 3 + Math.floor(rng() * 4);
            pool.slice(0, n).forEach(executeTrade);
            loop();
          }, delay);
        };
        setTimeout(loop, 8000);
      }

      function showReloadMask(id, holdMs) {
        const view = slotOfBot(id);
        const root = phones.get(view);
        if (!root) return;
        attachReloadMask(root);
        const mask = root.querySelector("[data-reload-mask]");
        const label = root.querySelector("[data-reload-text]");
        if (label) label.textContent = Math.random() < 0.5 ? "[SYSTEM RELOADING]" : "[API RECONNECTING...]";
        reloadingIds.add(id);
        mask.style.visibility = "visible";
        mask.style.opacity = "1";
        setTimeout(() => {
          const st = botState.get(id);
          const slot = slotsCache.find((s) => s.id === id);
          if (st && slot) {
            paint(id);
          }
          mask.style.opacity = "0";
          setTimeout(() => {
            mask.style.visibility = "hidden";
            reloadingIds.delete(id);
            if (st) paint(id);
          }, 380);
        }, holdMs);
      }

      function startReloadEngine() {
        if (reloadStarted) return;
        reloadStarted = true;
        injectReloadStyles();
        const loop = () => {
          const delay = 45000 + Math.floor(Math.random() * 45000);
          setTimeout(() => {
            const pool = Array.from({ length: PAGE_SIZE }, (_, i) => groupIndex * PAGE_SIZE + i + 1)
              .filter((id) => !reloadingIds.has(id));
            if (pool.length) {
              const id = pool[Math.floor(Math.random() * pool.length)];
              const hold = 3000 + Math.floor(Math.random() * 2000);
              showReloadMask(id, hold);
            }
            loop();
          }, delay);
        };
        loop();
      }

      loadLedger();
      buildGroupBar();
      for (let i = 1; i <= PAGE_SIZE; i += 1) {
        const el = phoneTemplate(i);
        wall.appendChild(el);
        phones.set(i, el);
      }
      window.addEventListener("pagehide", () => {
        for (const st of botState.values()) persistBot(st);
        flushLedger();
      });

      applyConfig(localSlots());
      fetch("/api/wall", { credentials: "include" })
        .then((res) => {
          if (res.status === 401) {
            window.location.href = "/login.html";
            return null;
          }
          return res.json();
        })
        .catch(() => null);

      document.getElementById("logout").addEventListener("click", async () => {
        localStorage.removeItem("auth_token");
        try {
          await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        } catch (_err) {}
        window.location.href = "/login.html";
      });

    </script>
  </body>
</html>
