<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理员后台 - 12 机器人大屏</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="login-view" class="flex min-h-screen items-center justify-center px-4">
      <form id="admin-login" class="w-full max-w-md space-y-4 rounded-2xl border border-slate-800 bg-slate-900 p-8">
        <h1 class="text-2xl font-semibold">管理员登录</h1>
        <p class="text-sm text-slate-400">使用 .env 中的 ADMIN_PASSWORD</p>
        <input
          name="password"
          type="password"
          required
          placeholder="管理员密码"
          class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 outline-none focus:border-amber-500"
        />
        <button class="w-full rounded-lg bg-amber-500 py-2 font-medium text-slate-950 hover:bg-amber-400">登录</button>
        <p id="login-status" class="min-h-5 text-sm text-rose-400"></p>
      </form>
    </div>

    <div id="dash-view" class="hidden">
      <header class="flex items-center justify-between border-b border-slate-800 px-6 py-3">
        <h1 class="text-lg font-semibold">管理员后台</h1>
        <div class="flex gap-3 text-sm">
          <a href="/" class="text-amber-400 hover:text-amber-300">打开大屏</a>
          <button id="logout" class="text-slate-400 hover:text-white">退出</button>
        </div>
      </header>

      <main class="mx-auto grid max-w-6xl gap-8 px-6 py-8 lg:grid-cols-2">
        <section class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="font-semibold">客户账号</h2>
            <button id="create-customer" class="rounded-md bg-amber-500 px-3 py-1.5 text-sm text-slate-950">
              新增客户
            </button>
          </div>
          <p id="once-secret" class="mb-3 hidden rounded-md bg-emerald-500/10 p-3 text-sm text-emerald-300"></p>
          <table class="w-full text-left text-sm">
            <thead class="text-slate-400">
              <tr>
                <th class="py-2">客户 ID</th>
                <th>创建时间</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="customer-rows"></tbody>
          </table>
        </section>

        <section class="rounded-2xl border border-slate-800 bg-slate-900 p-5 lg:col-span-1">
          <h2 class="mb-4 font-semibold">12 个币安 API 槽位</h2>
          <div id="slot-list" class="space-y-3"></div>
        </section>
      </main>
    </div>

    <script>
      const loginView = document.getElementById("login-view");
      const dashView = document.getElementById("dash-view");
      const onceSecret = document.getElementById("once-secret");

      async function api(url, options = {}) {
        const res = await fetch(url, { credentials: "include", ...options });
        const json = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(json.error || "请求失败");
        return json;
      }

      async function refresh() {
        const [customers, slots] = await Promise.all([api("/api/admin/customers"), api("/api/admin/slots")]);
        const tbody = document.getElementById("customer-rows");
        tbody.innerHTML = customers.customers.length
          ? customers.customers
              .map(
                (item) => `<tr class="border-t border-slate-800">
                  <td class="py-2 font-mono">${item.id}</td>
                  <td class="text-slate-400">${new Date(item.createdAt).toLocaleString()}</td>
                  <td class="text-right space-x-2">
                    <button data-reset="${item.id}" class="text-amber-400">重置密码</button>
                    <button data-del="${item.id}" class="text-rose-400">删除</button>
                  </td>
                </tr>`
              )
              .join("")
          : `<tr><td class="py-4 text-slate-500" colspan="3">暂无客户，请先新增</td></tr>`;

        tbody.querySelectorAll("[data-reset]").forEach((btn) => {
          btn.onclick = async () => {
            const data = await api(`/api/admin/customers/${btn.dataset.reset}/reset`, { method: "POST" });
            showOnce(data.customer);
          };
        });
        tbody.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = async () => {
            if (!confirm("确认删除该客户？")) return;
            await api(`/api/admin/customers/${btn.dataset.del}`, { method: "DELETE" });
            refresh();
          };
        });

        const list = document.getElementById("slot-list");
        list.innerHTML = slots.slots
          .map(
            (slot) => `<form data-slot="${slot.id}" class="rounded-xl border border-slate-800 bg-slate-950 p-3 space-y-2">
              <div class="flex items-center justify-between text-sm">
                <strong>${slot.label}</strong>
                <span class="text-slate-400">${slot.configured ? "已配置 " + slot.apiKeyMasked : "未配置"}</span>
              </div>
              <input name="label" value="${slot.label}" class="w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-sm" />
              <input name="apiKey" placeholder="API Key（留空则保留原值）" class="w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-sm" />
              <input name="apiSecret" type="password" placeholder="Secret Key（留空则保留原值）" class="w-full rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-sm" />
              <label class="flex items-center gap-2 text-xs text-slate-400">
                <input type="checkbox" name="readOnly" ${slot.readOnly ? "checked" : ""} /> 只读 Key
              </label>
              <div class="flex gap-2">
                <button class="rounded-md bg-amber-500 px-3 py-1 text-sm text-slate-950">保存</button>
                <button type="button" data-clear="${slot.id}" class="rounded-md bg-slate-800 px-3 py-1 text-sm">清空</button>
              </div>
            </form>`
          )
          .join("");

        list.querySelectorAll("form[data-slot]").forEach((form) => {
          form.onsubmit = async (event) => {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(form));
            await api(`/api/admin/slots/${form.dataset.slot}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                label: data.label,
                apiKey: data.apiKey,
                apiSecret: data.apiSecret,
                readOnly: Boolean(data.readOnly),
              }),
            });
            refresh();
          };
        });
        list.querySelectorAll("[data-clear]").forEach((btn) => {
          btn.onclick = async () => {
            await api(`/api/admin/slots/${btn.dataset.clear}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ clear: true }),
            });
            refresh();
          };
        });
      }

      function showOnce(customer) {
        onceSecret.classList.remove("hidden");
        onceSecret.textContent = `请立即保存：ID ${customer.id}  /  密码 ${customer.password}（只显示一次）`;
      }

      function showDash() {
        loginView.classList.add("hidden");
        dashView.classList.remove("hidden");
        refresh();
      }

      fetch("/api/auth/me", { credentials: "include" })
        .then((res) => res.json())
        .then((data) => {
          if (data.role === "admin") showDash();
        })
        .catch(() => {});

      document.getElementById("admin-login").addEventListener("submit", async (event) => {
        event.preventDefault();
        const password = new FormData(event.target).get("password");
        try {
          await api("/api/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          showDash();
        } catch (err) {
          document.getElementById("login-status").textContent = err.message;
        }
      });

      document.getElementById("create-customer").addEventListener("click", async () => {
        const data = await api("/api/admin/customers", { method: "POST" });
        showOnce(data.customer);
        refresh();
      });

      document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
        window.location.reload();
      });
    </script>
  </body>
</html>
